name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Setup www folder
        run: |
          mkdir -p www
          cp MathGenius_v5__1_.html www/index.html
          cat > www/manifest.json << 'EOF'
          {
            "name": "MathGenius",
            "short_name": "MathGenius",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#2563eb",
            "theme_color": "#2563eb",
            "icons": [
              { "src": "icon.png", "sizes": "512x512", "type": "image/png" }
            ]
          }
          EOF
          echo "✅ www:"
          ls -la www/

      - name: Setup assets (icon + splash)
        run: |
          pip install Pillow --quiet
          python3 << 'EOF'
          from PIL import Image
          import os, shutil
          os.makedirs("assets", exist_ok=True)

          # ── ICON ──
          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              img = img.resize((1024, 1024), Image.LANCZOS)
              img.save("assets/icon.png")
              print("✅ Custom icon used")
          else:
              from PIL import ImageDraw, ImageFont
              img = Image.new("RGB", (1024, 1024), "#1e40af")
              d = ImageDraw.Draw(img)
              d.ellipse([60,60,964,964], fill="#2563eb")
              d.ellipse([160,160,864,864], fill="#7c3aed")
              d.text((512,512), "MG", fill="white", anchor="mm",
                     font=ImageFont.load_default(size=260))
              img.save("assets/icon.png")
              print("✅ Auto icon generated")

          # ── SPLASH ──
          if os.path.exists("splash.png"):
              spl = Image.open("splash.png").convert("RGBA")
              spl = spl.resize((2732, 2732), Image.LANCZOS)
              spl.save("assets/splash.png")
              print("✅ Custom splash used")
          else:
              from PIL import ImageDraw, ImageFont
              spl = Image.new("RGB", (2732, 2732), "#1e3a8a")
              d2 = ImageDraw.Draw(spl)
              d2.rectangle([0,0,2732,2732], fill="#1e3a8a")
              d2.ellipse([866,866,1866,1866], fill="#2563eb")
              d2.text((1366,1200), "Math", fill="white", anchor="mm",
                      font=ImageFont.load_default(size=300))
              d2.text((1366,1580), "Genius", fill="#93c5fd", anchor="mm",
                      font=ImageFont.load_default(size=270))
              spl.save("assets/splash.png")
              print("✅ Auto splash generated")

          # copy icon to www for manifest
          shutil.copy("assets/icon.png", "www/icon.png")
          print("✅ Assets ready")
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathGenius-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
