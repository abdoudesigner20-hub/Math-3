name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify www folder exists
        run: |
          mkdir -p www
          ls -la www/

      - name: Generate Icon and Splash Screen
        run: |
          mkdir -p assets
          convert -size 1024x1024 \
            gradient:'#2563eb-#7c3aed' \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -pointsize 360 \
            -fill white \
            -annotate 0 "MG" \
            assets/icon.png

          convert -size 2732x2732 \
            gradient:'#2563eb-#7c3aed' \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -pointsize 220 \
            -fill white \
            -annotate 0 "MathGenius" \
            assets/splash.png

          echo "Icon and Splash created:"
          ls -la assets/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MathGenius-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
