name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create icon and splash with Python
        run: |
          pip install Pillow --quiet
          python3 << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          os.makedirs("assets", exist_ok=True)

          # ── ICON 1024x1024 ──
          img = Image.new("RGB", (1024, 1024), "#2563eb")
          d = ImageDraw.Draw(img)
          d.ellipse([100,100,924,924], fill="#7c3aed")
          d.text((512, 480), "MG", fill="white", anchor="mm", font=ImageFont.load_default(size=260))
          img.save("assets/icon.png")

          # ── SPLASH 2732x2732 ──
          spl = Image.new("RGB", (2732, 2732), "#2563eb")
          d2 = ImageDraw.Draw(spl)
          d2.text((1366, 1200), "Math", fill="white", anchor="mm", font=ImageFont.load_default(size=300))
          d2.text((1366, 1550), "Genius", fill="#a5b4fc", anchor="mm", font=ImageFont.load_default(size=280))
          spl.save("assets/splash.png")

          print("✅ Icon:", os.path.getsize("assets/icon.png"), "bytes")
          print("✅ Splash:", os.path.getsize("assets/splash.png"), "bytes")
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathGenius-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
